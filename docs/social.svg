<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img"
     aria-label="blueprint-runtime: test Make.com scenarios offline. 71 of 79 real Make runs reproduced exactly, 0 differ.">
